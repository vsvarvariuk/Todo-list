{% extends "base.html" %}
{% block content %}
    <h1>Task list
        <a href="{% url "Todo:task-create" %}">Add</a>
    </h1>
    {% if task_list %}
        {% for task in task_list %}
            <p>{{ task.content }}: {{ task.is_done }}</p>
            <ul>
            <li>{{ task.tags.name }}</li>
            </ul>
            <br>
            {% if task.is_done %}
                <button>Undo</button>
                {% else %}
                <button>Complete</button>
            {% endif %}
            <br>
            <a href="{% url "Todo:task-update" pk=task.id %}">Update</a>
            <a href="{% url "Todo:task-delete" pk=task.id %}">Delete</a>
        {% endfor %}
        {% else %}
        No task yet

    {% endif %}

{% endblock %}
