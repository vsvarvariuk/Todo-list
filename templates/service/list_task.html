{% extends "base.html" %}
{% block content %}
    <h1>Task list <button>
        <a href="{% url "" %}"></a>
    </button></h1>
    {% if task_list %}
        {% for task in task_list %}
            <p>{{ task.content }}: {{ task.is_done }}</p>
            <ul>
            <li>{{ task.tags }}</li>
            </ul>
        {% endfor %}
        {% else %}
        No task yet
    {% endif %}
{% endblock %}
