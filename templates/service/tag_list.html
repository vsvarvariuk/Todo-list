{% extends "base.html" %}

{% block content %}
  <h1 class="mb-4">Tag List <a href="{% url 'Todo:tag-create' %}" class="btn btn-success float-right">Add</a></h1>

  {% if tag_list %}
    <table class="table table-bordered">
      <thead>
        <tr>
          <th>Name</th>
          <th>Update</th>
          <th>Delete</th>
        </tr>
      </thead>
      <tbody>
        {% for tag in tag_list %}
          <tr>
            <td>{{ tag.name }}</td>
            <td><a href="{% url 'Todo:tag-update' pk=tag.id %}" class="btn btn-info btn-sm">Update</a></td>
            <td><a href="{% url 'Todo:tag-delete' pk=tag.id %}" class="btn btn-danger btn-sm">Delete</a></td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  {% else %}
    <p>No tags yet.</p>
  {% endif %}
{% endblock %}
