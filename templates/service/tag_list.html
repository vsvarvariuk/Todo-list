{% extends "base.html" %}
{% block content %}
    <h1>Tag list
        <a href="{% url "Todo:tag-create" %}">Add</a>
    </h1>
    {% if tag_list %}
        <table>
        <thead>
        <tr>
            <th>Name</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>
        </thead>
        <tbody>
        {% for tag in tag_list %}
            <tr>
            <td>{{ tag.name }}</td>
            <td><a href="{% url "Todo:tag-update" pk=tag.id %}">Update</a></td>
            <td><a href="{% url "Todo:tag-delete" pk=tag.id %}">Delete</a></td>
            </tr>
        {% endfor %}
        </tbody>
        </table>
        {% else %}
        No tags yet

    {% endif %}

{% endblock %}
