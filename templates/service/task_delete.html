{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block content %}
  <h1>Delete Task</h1>
  <p>Do you really want to delete task {{ task.content }}?</p>
  <form action="" method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <input type="submit" value="Delete" class="btn btn-danger">
  </form>
{% endblock %}
